<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic Landscape</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Sonic Landscape</h1>
    <p class="app-subtitle">Explore acoustic environments around the world</p>
  </header>

  <main class="app-main">
    <div id="map" role="application" aria-label="Interactive sound location map"></div>

    <aside id="detail-panel" class="detail-panel detail-panel--hidden" aria-live="polite">
      <button id="detail-close" class="detail-close" aria-label="Close details">&times;</button>
      <div id="detail-content" class="detail-content">
        <!-- populated dynamically -->
      </div>
    </aside>
  </main>

  <div id="zoom-hint" class="zoom-hint" role="status" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLEo="
    crossorigin=""
  ></script>

  <script src="src/data.js"></script>
  <script src="src/map.js"></script>
</body>
</html>

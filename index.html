<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#20263a" />
  <title>CONTOURS — a playable album</title>
  <meta name="description" content="A topographic map as a score. Eight Highland glens, one record. Walk the land; play the land." />
  <style>
    html, body { margin: 0; height: 100%; background: #20263a; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #screen { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
    noscript { color: #f2ead3; font: 14px monospace; position: absolute; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <canvas id="screen" width="384" height="216" tabindex="0" aria-label="CONTOURS — a topographic map you play by walking. Arrow keys or WASD to walk, Shift to run, Space to rest and listen, M for map, L for field notes, Escape to pause."></canvas>
  <noscript>CONTOURS needs JavaScript and Web Audio.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONTOURS render preview</title>
<style>
  html, body { margin: 0; background: #20263a; color: #f2ead3; font: 12px monospace; }
  canvas { image-rendering: pixelated; display: block; }
  #log { padding: 6px; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen" width="384" height="216"></canvas>
<div id="log">render-preview: drive me with window.P (see tools/render-preview.mjs)</div>
<script type="module">
import { COVER, CELL_PX, MAP_SIZE, dayPhase } from '/src/world/codes.js';
import { buildMockWorld } from '/tools/mock-world.js';
import { PAL_U32_LIST, PAL_NAMES } from '/src/render/palette.js';
import { walkerSprite, gateSprite, lanternAnchor } from '/src/render/sprites.js';

// strict palette check: every pixel of every drawn frame must be one of the PAL_COUNT colours
const PAL_SET = new Set(PAL_U32_LIST.map((u) => u & 0xffffff));
const used = new Set();
let bad = 0;
function checkPalette() {
  const d = canvas.getContext('2d').getImageData(0, 0, 384, 216);
  const u = new Uint32Array(d.data.buffer);
  const frameBad = new Set();
  for (let i = 0; i < u.length; i++) {
    const k = u[i] & 0xffffff;
    if (PAL_SET.has(k) && (u[i] >>> 24) === 255) used.add(k); else frameBad.add(k);
  }
  bad += frameBad.size;
  return frameBad.size;
}

const log = (...a) => { document.getElementById('log').textContent += '\n' + a.join(' '); };
const canvas = document.getElementById('screen');
let renderer = null;
let world = null;
let real = null;

async function loadReal() {
  if (real !== null) return real;
  try {
    const t = await import('/src/world/terrain.js');
    const l = await import('/src/world/levels/index.js');
    real = { buildWorld: t.buildWorld, LEVELS: l.LEVELS };
  } catch (e) { real = false; log('real world unavailable:', e.message); }
  return real;
}

function scaled(src, sx, sy, sw, sh, scale) {
  const c = document.createElement('canvas');
  c.width = sw * scale; c.height = sh * scale;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(src, sx, sy, sw, sh, 0, 0, sw * scale, sh * scale);
  return c.toDataURL('image/png');
}

function makeState(w, o = {}) {
  let pos = o.pos || { x: w.spawn.x, y: w.spawn.y };
  if (o.at) {
    const poi = w.pois.find((q) => q.type === o.at);
    if (poi) pos = { x: poi.x + (o.dx || 0), y: poi.y + (o.dy || 0) };
  }
  if (o.atIdx != null) { const q = w.pois[o.atIdx]; pos = { x: q.x + (o.dx || 0), y: q.y + (o.dy || 0) }; }
  const tod = o.tod ?? 0.3;
  const hdg = o.heading ?? 0;
  if (o.onCover) {
    const want = COVER[o.onCover];
    let best = null, bd = 1e9;
    for (let y = 2; y < w.size - 2; y++) for (let x = 2; x < w.size - 2; x++) {
      if (w.cover[y * w.size + x] !== want) continue;
      // want a spot whose 5x5 neighbourhood is mostly the same cover (not a sliver)
      let n = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (w.cover[(y + dy) * w.size + x + dx] === want) n++;
      if (n < 20) continue;
      const d = Math.hypot(x - pos.x, y - pos.y);
      if (d < bd) { bd = d; best = { x: x + 0.5, y: y + 0.5 }; }
    }
    if (best) pos = best;
  }
  const cover = w.coverAt(pos.x, pos.y);
  const speed = o.speed ?? 0;
  const st = {
    t: o.t ?? 12, dt: 1 / 60, levelIndex: w.level.index || 0, level: w.level, world: w,
    player: {
      x: pos.x, y: pos.y, vx: Math.cos(hdg) * speed, vy: Math.sin(hdg) * speed, speed, heading: hdg,
      elevation: w.heightAt(pos.x, pos.y), vz: 0, slope: w.slopeAt(pos.x, pos.y), cover,
      moving: speed > 0.3, still: speed > 0.3 ? 0 : 3, running: speed > 6, resting: false, sliding: !!o.sliding,
      contourIndex: Math.floor(w.heightAt(pos.x, pos.y) / w.contourInterval),
    },
    timeOfDay: tod, phase: dayPhase(tod), events: [],
    proximity: (o.proximity || []).map((id) => { const poi = w.pois.find((p) => p.id === id || p.type === id); return { poi, dist: Math.hypot(poi.x - pos.x, poi.y - pos.y) }; }),
    resonance: (o.resonance || []).map((type, i) => ({ poiId: (w.pois.find((q) => q.type === type) || {}).id || 'r' + i, type, t0: 0, strength: 1 - i * 0.28 })),
    gateOpen: !!o.gateOpen,
    chainProgress: w.gate.chain.map((type, i) => {
      const same = w.pois.filter((q) => q.type === type);
      let nearest = null;
      for (const q of same) {
        const d = Math.hypot(q.x - pos.x, q.y - pos.y);
        if (!nearest || d < nearest.dist) nearest = { poiId: q.id, name: q.name, x: q.x, y: q.y, dist: d, bearing: Math.atan2(q.y - pos.y, q.x - pos.x) };
      }
      const lit = (o.litTypes ? o.litTypes.includes(type) : i < (o.chainLit ?? 0));
      return { type, resonating: lit, remaining: lit ? Math.max(4, 90 - i * 31) : 0, count: same.length, nearest: o.noNearest ? null : nearest };
    }),
    knowledge: o.know ? makeKnowledge(w, o.know) : {},
    trail: o.trail ? makeTrail(w, pos, o.trail) : [],
    fragments: o.fragments || [], discovered: (o.discovered || []).map((t) => (w.pois.find((p) => p.type === t) || {}).id).filter(Boolean),
    levelComplete: false,
  };
  return st;
}

function condKeys(c) { return Object.keys(c || {}); }
/** demo knowledge: a mix of woken, heard (with learned conditions) and heard-only POIs */
function makeKnowledge(w, mode) {
  const k = {};
  const ps = w.pois;
  ps.forEach((q, i) => {
    const learned = condKeys(q.condition);
    if (i === 0) k[q.id] = { heard: 2, woken: true, learned };
    else if (i === 1 || i === 4) k[q.id] = { heard: 1, woken: false, learned };
    else if (i === 2) k[q.id] = { heard: 1, woken: false, learned: [] };
    else if (i === 3) k[q.id] = { heard: 1, woken: true, learned: [] };
  });
  return k;
}
/** a wandering route: spawn -> first POIs -> player, a point every 1.5 cells */
function makeTrail(w, pos, mode) {
  const way = [{ x: w.spawn.x, y: w.spawn.y }, ...w.pois.slice(0, 4).map((q) => ({ x: q.x, y: q.y })), pos];
  const pts = [];
  for (let s = 0; s < way.length - 1; s++) {
    const a = way[s], b = way[s + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.floor(len / 1.5));
    for (let i = 0; i < n; i++) {
      const t = i / n, wob = Math.sin(t * 9 + s) * 2.2;
      const nx = -(b.y - a.y) / (len || 1), ny = (b.x - a.x) / (len || 1);
      pts.push({ x: a.x + (b.x - a.x) * t + nx * wob, y: a.y + (b.y - a.y) * t + ny * wob });
    }
  }
  return pts;
}

window.P = {
  async setWorld(spec) {
    const [src, key] = spec.split(':');
    if (src === 'real') {
      const r = await loadReal();
      if (!r) return { error: 'no real world' };
      const t0 = performance.now();
      world = r.buildWorld(r.LEVELS[+key]);
      log('buildWorld', key, Math.round(performance.now() - t0), 'ms');
    } else world = buildMockWorld(key);
    window.world = world;
    return { name: world.level.name, minH: world.minH, maxH: world.maxH, levels: real ? real.LEVELS.length : 0 };
  },
  /** build every track's real skyline for the story panels and tracklist thumbnails */
  async warmProfiles() { const m = await import('/src/render/panels.js'); for (let i = 0; i < 8; i++) m.warmProfile(i); return true; },
  async levelDefs() {
    const r = await loadReal();
    return r ? r.LEVELS.map((l) => ({ id: l.id, index: l.index, name: l.name, gaelic: l.gaelic, gridLetters: l.gridLetters, subtitle: l.subtitle, palette: l.palette, gate: { chain: l.gate.chain } })) : null;
  },
  async realLevels() { const r = await loadReal(); return r ? r.LEVELS.length : 0; },
  async bake() {
    const m = await import('/src/render/mapbake.js');
    const t0 = performance.now();
    const c = m.bakeMap(world);
    window.baked = c;
    return { ms: performance.now() - t0, bakeMs: c.bakeMs, prof: c.bakeProfile };
  },
  bakeCrop(x, y, w, h, scale) { return scaled(window.baked, x, y, w, h, scale); },
  async overview(n, grid) {
    const m = await import('/src/render/mapbake.js');
    const c = m.bakeOverview(world, n, { grid });
    return scaled(c, 0, 0, n, n, Math.max(1, Math.floor(432 / n)));
  },
  async initRenderer() {
    const m = await import('/src/render/renderer.js');
    renderer = m.createRenderer(canvas);
    window.renderer = renderer;
    return true;
  },
  async useWorldInRenderer() {
    const t0 = performance.now();
    renderer.setWorld(world);
    return performance.now() - t0;
  },
  /** draw one frame and return it scaled up */
  frame(spec, scale = 3) {
    const { state, pre = [] } = spec;
    let ui = spec.ui;
    if (spec.touch) {
      const r = canvas.getBoundingClientRect();
      const sz = Math.max(44, Math.min(72, Math.min(r.width, r.height) * 0.13)), g = sz * 0.25, R = r.left + r.width, B = r.top + r.height;
      const btn = (id, x, y, w = sz, h = sz, held = false) => ({ id, x, y, w, h, held });
      ui = { ...ui, touchVisible: true, touch: {
        stick: spec.touch === 'active' ? { active: true, cx: r.left + r.width * 0.16, cy: r.top + r.height * 0.74, x: 0.55, y: -0.4, radius: 56 } : { active: false, cx: 0, cy: 0, x: 0, y: 0, radius: 56 },
        buttons: [btn('run', R - sz - g, B - sz - g, sz, sz, spec.touch === 'active'), btn('rest', R - 2 * sz - 2 * g, B - sz - g), btn('map', R - sz - g, r.top + g, sz * 0.8, sz * 0.6), btn('notes', R - 2 * sz * 0.8 - 2 * g, r.top + g, sz * 0.8, sz * 0.6), btn('pause', R - 3 * sz * 0.8 - 3 * g, r.top + g, sz * 0.8, sz * 0.6)],
      } };
    }
    const st = state === null ? null : makeState(world, state || {});
    if (st && state && state.resting) st.player.resting = true;
    if (spec.fresh !== false) { const R = renderer._R; R.cam.ready = false; R.flashes.length = 0; R.ripples.length = 0; R.pulses.length = 0; R.trail.length = 0; R.lastNow = null; R.clock = (ui && ui.time != null ? ui.time : 5); }
    for (const p of pre) {
      if (p.op === 'flash') renderer.flashContour(p.index != null ? p.index : st.player.contourIndex, 0);
      if (p.op === 'rippleAtPlayer') renderer.ripple(st.player.x, st.player.y, 0, p.color);
      if (p.op === 'ripple') renderer.ripple(p.x, p.y, 0, p.color);
      if (p.op === 'pulse') renderer.pulse(p.type);
    }
    // warm the camera and animation clock so smoothing has settled
    const steps = spec.warm ?? 3;
    for (let i = 0; i < steps; i++) { if (st) st.t += 1 / 60; renderer.draw(st, { screen: 'play', ...ui, time: (ui && ui.time != null ? ui.time : 5) + i / 60 }); }
    if (spec.advance) {
      for (let i = 0; i < spec.advance * 60; i++) { if (st) st.t += 1 / 60; renderer.draw(st, { screen: 'play', ...ui, time: (ui && ui.time != null ? ui.time : 5) + (steps + i) / 60 }); }
    }
    window.lastBad = checkPalette();
    return scaled(canvas, 0, 0, 384, 216, scale);
  },
  /** palette audit so far: { bad: frames*colours outside the palette, used: distinct palette colours seen } */
  paletteReport() { return { bad, used: used.size, of: PAL_NAMES.length, lastBad: window.lastBad || 0 }; },
  /** time (renderer clock seconds) of lightning strike i on the current level, or null */
  strike(i) { return renderer.fx.strikeTime(i); },
  fxInfo() { return { weather: renderer.fx.weather, id: renderer.fx.levelId, bothies: renderer.fx.bothies().length }; },
  /** walker poses and the gate cross at 8x on paper / night / grass */
  sprites(scale = 8) {
    const rows = [];
    const dirs = ['S', 'N', 'E', 'W'];
    const poses = [];
    for (const d of dirs) poses.push(['idle', d, 0], ['idle', d, 1], ['walk', d, 0], ['walk', d, 1]);
    poses.push(['slide', 'E', 0], ['slide', 'W', 0], ['wade', 'S', 0], ['wade', 'E', 1], ['mud', 'S', 0], ['mud', 'E', 1]);
    const bgs = ['#f2ead3', '#20263a', '#9cc58a'];
    const cell = 12 * scale + 6;
    const per = 8;
    const nrows = Math.ceil(poses.length / per);
    const c = document.createElement('canvas');
    c.width = per * cell + 6; c.height = bgs.length * nrows * cell + 6;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.fillStyle = '#444'; x.fillRect(0, 0, c.width, c.height);
    bgs.forEach((bg, bi) => poses.forEach(([pose, d, f], i) => {
      const ox = 6 + (i % per) * cell, oy = 6 + (bi * nrows + Math.floor(i / per)) * cell;
      x.fillStyle = bg; x.fillRect(ox, oy, 12 * scale, 12 * scale);
      x.drawImage(walkerSprite(d, pose, f), ox, oy, 12 * scale, 12 * scale);
      const a = lanternAnchor(d, pose, f);
      x.fillStyle = '#c2357e'; x.fillRect(ox + a.x * scale + scale / 2 - 1, oy + a.y * scale + scale / 2 - 1, 2, 2);
    }));
    return c.toDataURL('image/png');
  },
  gates(scale = 10) {
    const bgs = ['#f2ead3', '#e6dcbc', '#20263a', '#a39d92'];
    const c = document.createElement('canvas');
    c.width = 2 * 12 * scale + 18; c.height = bgs.length * (11 * scale + 6) + 6;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    bgs.forEach((bg, i) => [false, true].forEach((open, j) => {
      x.fillStyle = bg; x.fillRect(6 + j * (12 * scale + 6), 6 + i * (11 * scale + 6), 12 * scale, 11 * scale);
      x.drawImage(gateSprite(open), 6 + j * (12 * scale + 6) + scale / 2, 6 + i * (11 * scale + 6) + scale / 2, 11 * scale, 10 * scale);
    }));
    return c.toDataURL('image/png');
  },
  /** draw one frame with extra weather time, return ms per draw() averaged over n frames */
  perfFx(n = 120, stateSpec = {}, t0 = 30) {
    const st = makeState(world, stateSpec);
    const R = renderer._R; R.cam.ready = false; R.lastNow = null;
    for (let i = 0; i < 20; i++) { st.t += 1 / 60; renderer.draw(st, { screen: 'play', time: t0 + i / 60 }); }
    const times = [];
    for (let i = 0; i < n; i++) {
      st.t += 1 / 60; st.player.x += 0.05;
      const a = performance.now();
      renderer.draw(st, { screen: 'play', time: t0 + (20 + i) / 60 });
      times.push(performance.now() - a);
    }
    times.sort((p, q) => p - q);
    return { avg: times.reduce((p, q) => p + q, 0) / n, p95: times[Math.floor(n * 0.95)], max: times[n - 1] };
  },
  /** like frame() but returns only a crop (screen px) at a larger scale: for art review */
  crop(spec, x, y, w, h, scale = 8) {
    this.frame(spec, 1);
    return scaled(canvas, x, y, w, h, scale);
  },
  perf(n = 120, stateSpec = {}) {
    const st = makeState(world, stateSpec);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { st.t += 1 / 60; st.player.x += 0.05; renderer.draw(st, { screen: 'play' }); }
    return (performance.now() - t0) / n;
  },
  poi(type) { return world.pois.find((p) => p.type === type); },
  world() { return world; },
};
window.__ready = true;
</script>
</body>
</html>

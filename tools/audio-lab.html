<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CONTOURS audio lab</title>
<style>
  :root { color-scheme: dark; --bg:#14161c; --panel:#1d2029; --ink:#e6e1d3; --dim:#8b8a85; --acc:#e3a857; --line:#2e3240; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  h1 { font-size:16px; margin:0 0 4px; } h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:10px 0; }
  button { background:#2a2f3d; color:var(--ink); border:1px solid #3b4155; border-radius:4px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { background:#353c50; } button:active, button.on { background:var(--acc); color:#1a1408; }
  label { display:inline-flex; gap:6px; align-items:center; color:var(--dim); min-width:250px; }
  label span.v { color:var(--ink); min-width:48px; text-align:right; }
  input[type=range] { width:150px; }
  #start { font-size:15px; padding:10px 18px; } #meter { width:100%; height:70px; background:#0e1014; border:1px solid var(--line); display:block; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:4px 14px; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<h1>CONTOURS audio lab</h1>
<div class="row"><button id="start">Start audio</button><span id="status" class="dim">click to create the AudioContext (browser autoplay policy)</span></div>
<canvas id="meter" width="1000" height="70"></canvas>
<div id="ui" hidden>
  <section><h2>Voices</h2><div class="row" id="voices"></div></section>
  <section><h2>Kit</h2>
    <div class="row" id="kit"></div>
    <div class="grid" style="margin-top:8px" id="kitopts"></div>
  </section>
  <section><h2>Reverb / Delay (global FX)</h2><div class="grid" id="fxrd"></div></section>
  <section><h2>Granular</h2><div class="grid" id="fxg"></div><div class="row" id="fxgb" style="margin-top:6px"></div></section>
  <section><h2>Master + channel</h2><div class="grid" id="fxm"></div></section>
  <section><h2>Sequences</h2><div class="row" id="seqs"></div><div class="dim" style="margin-top:6px">Audit: <button id="audit">print param audit to console</button></div></section>
</div>
<script type="module" src="./audio-lab.js"></script>
</body>
</html>
